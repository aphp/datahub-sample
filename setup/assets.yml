kind: STRUCTURED_PROPERTY
qualifiedName: "fr.aphp.healthdcat.healthCategory"
displayName: "Catégorie de données de santé"
description: >
  healthdcatap:healthCategory — remplace les tags healthCategory:* (dépréciés).
  Vocabulaire EHDS (17 catégories, Annexe II du règlement EHDS).
cardinality: MULTIPLE
valueType: "string"
allowedValues:
  - value: "EHRS"
    description: "Dossiers de santé électroniques"
  - value: "DIOH"
    description: "Facteurs influant sur la santé (déterminants socio-économiques, environnementaux)"
  - value: "NRPE"
    description: "Besoins, ressources et dépenses en soins de santé"
  - value: "RPDG"
    description: "Agents pathogènes ayant un impact sur la santé humaine"
  - value: "HRAD"
    description: "Données administratives liées aux soins de santé"
  - value: "HGPD"
    description: "Données génétiques, épigénomiques et génomiques humaines"
  - value: "HPML"
    description: "Autres données moléculaires humaines (protéomique, transcriptomique...)"
  - value: "PGEH"
    description: "Données de santé électroniques personnelles générées par dispositifs médicaux"
  - value: "WELA"
    description: "Données provenant d'applications de bien-être"
  - value: "IDHP"
    description: "Statut professionnel des professionnels de santé"
  - value: "PHDR"
    description: "Registres de santé publique"
  - value: "MRMR"
    description: "Registres médicaux et de mortalité"
  - value: "EHCT"
    description: "Essais et investigations cliniques"
  - value: "EMRD"
    description: "Autres données de santé provenant de dispositifs médicaux"
  - value: "RMMD"
    description: "Registres de produits médicinaux et dispositifs médicaux"
  - value: "RQSH"
    description: "Cohortes de recherche, questionnaires et enquêtes santé"
  - value: "EINS"
    description: "Biobanques et bases de données associées"
entityTypes: [dataProduct]
