    description: "Art. 6(1)(d) — Sauvegarde des intérêts vitaux"
  - value: "eu-gdpr:A6-1-e"
    description: "Art. 6(1)(e) — Mission d'intérêt public / autorité publique"
  - value: "eu-gdpr:A6-1-f"
    description: "Art. 6(1)(f) — Intérêts légitimes"
  # Art. 9 — données de santé (catégories particulières)
  - value: "eu-gdpr:A9-2-a"
    description: "Art. 9(2)(a) — Consentement explicite"
  - value: "eu-gdpr:A9-2-b"
    description: "Art. 9(2)(b) — Droit du travail / protection sociale"
  - value: "eu-gdpr:A9-2-c"
    description: "Art. 9(2)(c) — Sauvegarde des intérêts vitaux"
  - value: "eu-gdpr:A9-2-h"
    description: "Art. 9(2)(h) — Médecine préventive / soins de santé"
  - value: "eu-gdpr:A9-2-i"
    description: "Art. 9(2)(i) — Intérêt public en santé publique"
  - value: "eu-gdpr:A9-2-j"
    description: "Art. 9(2)(j) — Recherche scientifique / statistiques"
