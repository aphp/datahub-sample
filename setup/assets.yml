---
kind: TAG
name: "dcat:sample"
description: >
  Marque un asset (Dataset DataHub) membre d'un DataProduct comme échantillon
  HealthDCAT-AP (adms:sample) plutôt que distribution complète
  (dcat:distribution). Un adms:sample n'a besoin que d'une dcat:accessURL
  pour être valide côté SHACL ; une dcat:distribution normale doit en plus
  porter dcat:byteSize, dct:format, dct:rights et
  dcatap:applicableLegislation.

# ----------------------------------------------------------------------------
# Historique : une première version de cette extension représentait
# publisher/creator/hdab via des CorpGroup + un OwnershipType custom
# (`type: urn:li:ownershipType:healthdcat.publisher` dans owners:). Abandonné
# après lecture du connecteur d'ingestion réel de ce dépôt
# (aphp/datahub-yaml-source, src/datahub_yaml_source/builders/common.py
# ::build_ownership_aspect) : il écrit `o.type` tel quel dans le champ enum
# `OwnerClass.type` sans jamais renseigner `typeUrn` — la syntaxe
# `type: urn:li:ownershipType:...` n'y est PAS interprétée comme un type
# personnalisé (contrairement au SDK Python OSS `datahub dataproduct upsert`,
# qui lui la supporte). `kind: CORP_GROUP`/`kind: OWNERSHIP_TYPE` n'existent
# d'ailleurs pas du tout dans ce connecteur (voir
# ENTITY_DOC_TYPES_BY_KIND dans src/datahub_yaml_source/models.py).
#
# D'où le choix ci-dessus : des propriétés structurées plates directement sur
# le DATA_PRODUCT (confirmé supporté :
# src/datahub_yaml_source/builders/data_product.py::build_data_product lit
# `structuredProperties:` du document DATA_PRODUCT et émet
# StructuredPropertiesClass). Plus simple, et le seul mécanisme qui
# fonctionne réellement avec ce connecteur.
# ----------------------------------------------------------------------------