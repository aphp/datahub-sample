kind: STRUCTURED_PROPERTY
qualifiedName: "fr.aphp.healthdcat.trustedDataHolder"
displayName: "Détenteur de confiance"
description: >
  healthdcatap:trustedDataHolder (xsd:boolean) — obligatoire pour le publisher.
  DataHub n'a pas de type booléen natif pour les structured properties : deux
  valeurs autorisées, sérialisées "true"^^xsd:boolean / "false"^^xsd:boolean.
  Terme retiré de HealthDCAT-AP côté EC (n'existait que dans le brouillon SEMIC
  v2/v3) ; conservé uniquement parce que le validateur SHACL du Catalogue HDH
  l'exige encore (:HealthPublisherAgent_Shape, sh:minCount 1). À reconsidérer
  si le HDH s'aligne sur R7.
cardinality: SINGLE
valueType: "string"
allowedValues:
  - value: "true"
  - value: "false"
entityTypes: [dataProduct]
