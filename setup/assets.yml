# ============================================================================
# Extension HealthDCAT-AP — Phase 0 (dh-healthdcat-exporter)
#
# Complète les 16 propriétés fr.aphp.healthdcat.* déjà déclarées ci-dessus
# pour couvrir les 18 propriétés obligatoires du profil SHACL "ehds" du HDH
# (shapes/ehds/hdap-validator-sensitivity-shape.ttl côté
# hdh/catalogue-de-metadonnees/api). Voir dh-healthdcat-exporter/docs/mapping.md
# pour le tableau de correspondance complet et le détail des choix.
#
# fr.aphp.healthdcat.retentionPeriod (déclarée plus haut) est dépréciée au
# profit de retentionPeriodStart/End ci-dessous : elle stocke une durée ISO
# 8601 (P10Y) alors que healthdcatap:retentionPeriod exige un dct:PeriodOfTime
# avec dates de début/fin. Elle n'est plus exportée mais reste déclarée (pas
# de suppression de données existantes).
# ============================================================================

---
