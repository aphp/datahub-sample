      nullable: false
      description: >
        Identifiant unique de l'occurrence de condition dans OMOP CDM.
        Dérivé du FHIR Condition.id.
      nativeDataType: varchar
      partOfKey: true

    - fieldPath: person_id
      type: string
      nullable: false
      description: >
        Référence à la personne concernée.
        Dérivé de Condition.subject.reference.
      nativeDataType: varchar

    - fieldPath: visit_occurrence_id
      type: string
      nullable: true
      description: >
        Référence à la visite parente dans visit_occurrence.
