      description: Valeur unique de l'identifiant.
      nativeDataType: string

    - fieldPath: encounter.display
      type: string
      nullable: true
      description: Texte alternatif pour la ressource référencée.
      nativeDataType: string

    # ── performed[dateTime] ──────────────────────────────────────────────────
    - fieldPath: performed.ofType(dateTime)
      type: date
      nullable: true
      description: >
        Date et heure de réalisation de la procédure
        (polymorphisme performed[x]). Seul le type dateTime
        est exploité dans cette ViewDefinition.
      nativeDataType: dateTime

    # ── code : CodeableConcept ───────────────────────────────────────────────
    - fieldPath: code
      type: record
      nullable: true
      description: Code identifiant la procédure réalisée.
      nativeDataType: CodeableConcept

    - fieldPath: code.coding
      type: array
      nullable: true
      description: Code défini par un système de terminologie.
      nativeDataType: Coding

    - fieldPath: code.coding.system
      type: string
      nullable: true
      description: URI du système de terminologie de la procédure.
      nativeDataType: uri

    - fieldPath: code.coding.version
      type: string
      nullable: true
      description: Version du système de terminologie, si pertinente.
      nativeDataType: string

    - fieldPath: code.coding.code
      type: enum
      nullable: true
      description: Code de la procédure dans le système de terminologie.
      nativeDataType: code

    - fieldPath: code.coding.display
      type: string
      nullable: true
      description: Libellé de la procédure tel que défini par le système de terminologie.
      nativeDataType: string

    - fieldPath: code.coding.userSelected
      type: boolean
      nullable: true
      description: Vrai si ce coding a été sélectionné directement par l'utilisateur.
      nativeDataType: boolean

    - fieldPath: code.text
      type: string
      nullable: true
      description: Représentation textuelle libre du code de procédure.
      nativeDataType: string

