name: "FHIR Condition (Z-codes) → OMOP Observation"
description: >
  Transformation des ressources FHIR Condition en table OMOP Observation
  via une ViewDefinition SQL on FHIR.
  Filtre complémentaire de condition_occurrence : seuls les codes Z87.2,
  Z37.0 et Z88.0 sont retenus (antécédents, accouchement, allergie médicamenteuse).
  Ces codes sont sémantiquement des observations et non des conditions cliniques
  actives dans le modèle OMOP AP-HP.
  Le observation_concept_id est fixé à 0 (mapping vocabulaire OMOP non réalisé).
  Le observation_type_concept_id est la constante 38000280 ("Observation recorded
  from EHR").
type: "ViewDefinition"

