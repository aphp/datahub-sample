description: >
  Table OMOP CDM Drug Exposure alimentée par deux jobs distincts :
  MedicationAdministration (drug_type_concept_id = 38000180)
  et MedicationRequest (drug_type_concept_id = 38000177).
  Le drug_concept_id est fixé à 0 (mapping vocabulaire OMOP non réalisé).
container:
  platform: postgres
  instance: postgres
  database: omop
  schema: public
  env: PROD
schema:
  fields:
    - fieldPath: drug_exposure_id
      type: string
      nullable: false
      description: >
        Identifiant unique de l'exposition médicamenteuse dans OMOP CDM.
        Dérivé de MedicationAdministration.id ou MedicationRequest.id.
      nativeDataType: varchar
      partOfKey: true

    - fieldPath: person_id
      type: string
      nullable: false
      description: Référence à la personne concernée.
      nativeDataType: varchar

