kind: DATA_FLOW
orchestrator: pathling
flowId: "fhir_semantic_layer_to_omop"
cluster: "PROD"
name: "FHIR Semantic Layer to OMOP"
description: >
  Pipeline Pathling de transformation des données cliniques FHIR
  vers le format de livraison OMOP.
project: "fhir2omop"
externalUrl: "https://gitlab.example.org/eds/ehr_to_fhir_semantic_layer"
domains: "c8eda4574cd1f980d8a5d1a2e72148b4"
#subTypes: "DBT"
tags:
  - fhir
  - omop
owners:
  - owner: "eds-data-engineering"
    type: "TECHNICAL_OWNER"
  - owner: "eds-interoperability"
    type: "BUSINESS_OWNER"
---
kind: DATA_JOB
jobId: "fhir_patient_to_omop_person"
dataFlow:
  orchestrator: pathling
  flowId: "fhir_semantic_layer_to_omop"
  cluster: "PROD"
name: "FHIR Patient → OMOP Person"
description: >
  Transformation des ressources FHIR Patient en table OMOP Person
  via une ViewDefinition SQL on FHIR. Calcul du gender_concept_id
  par mapping conditionnel, et décomposition de birthDate en
  year_of_birth, month_of_birth, day_of_birth.
type: "ViewDefinition"

inputDatasets:
  - platform: s3
    name: sharing_layer_Patient.ndjson
    env: PROD

outputDatasets:
  - platform: postgres
    name: omop_public_person
    env: PROD

fineGrainedLineages:
  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: id
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: person_id
    operation: "IDENTITY"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: gender
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: gender_concept_id
    operation: "OMOP_GENDER_CONCEPT_MAPPING"
    # gender.where($this = 'female').count() * 8532 + gender.where($this = 'male').count() * 8507
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: birthDate
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: birth_date
    operation: "IDENTITY"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: birthDate
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: year_of_birth
    operation: "DATE_EXTRACT_YEAR"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: birthDate
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: month_of_birth
    operation: "DATE_EXTRACT_MONTH"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: birthDate
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: day_of_birth
    operation: "DATE_EXTRACT_DAY"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: id
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: location_id
    operation: "IDENTITY"
    confidence: 0.5
    # Hypothèse : location_id est dérivé du patient.id en l'absence
    # de jointure explicite sur une table d'adresse dans cette ViewDefinition

  - upstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: gender
    downstream:
      platform: postgres
      name: omop_public_person
      env: PROD
      fieldPath: gender_source_value
    operation: "IDENTITY"
    confidence: 1.0

---

kind: DATA_JOB
jobId: "fhir_encounter_to_omop_visit_occurrence"
dataFlow:
  orchestrator: pathling
  flowId: "fhir_semantic_layer_to_omop"
  cluster: "PROD"
name: "FHIR Encounter → OMOP Visit Occurrence"
description: >
  Transformation des ressources FHIR Encounter en table OMOP Visit Occurrence
  via une ViewDefinition SQL on FHIR. Mapping conditionnel du visit_concept_id
  depuis class.code (IMP→9201, AMB→9202, EMER→9203), et mapping des modes
  d'admission et de sortie vers les concepts OMOP admitted_from / discharged_to.
type: "ViewDefinition"

inputDatasets:
  - platform: s3
    name: sharing_layer_Encounter.ndjson
    env: PROD

outputDatasets:
  - platform: postgres
    name: omop_public_visit_occurrence
    env: PROD

fineGrainedLineages:
  - upstream:
      platform: s3
      name: sharing_layer_Encounter.ndjson
      env: PROD
      fieldPath: id
    downstream:
      platform: postgres
      name: omop_public_visit_occurrence
      env: PROD
      fieldPath: visit_occurrence_id
    operation: "IDENTITY"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Encounter.ndjson
      env: PROD
      fieldPath: subject.reference
    downstream:
      platform: postgres
      name: omop_public_visit_occurrence
      env: PROD
      fieldPath: person_id
    operation: "IDENTITY"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Encounter.ndjson
      env: PROD
      fieldPath: period.start
    downstream:
      platform: postgres
      name: omop_public_visit_occurrence
      env: PROD
      fieldPath: visit_start_date
    operation: "IDENTITY"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Encounter.ndjson
      env: PROD
      fieldPath: period.end
    downstream:
      platform: postgres
      name: omop_public_visit_occurrence
      env: PROD
      fieldPath: visit_end_date
    operation: "IDENTITY"
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Encounter.ndjson
      env: PROD
      fieldPath: class.code
    downstream:
      platform: postgres
      name: omop_public_visit_occurrence
      env: PROD
      fieldPath: visit_concept_id
    operation: "OMOP_VISIT_CONCEPT_MAPPING"
    # class.code.where($this = 'IMP').count() * 9201
    # + class.code.where($this = 'AMB').count() * 9202
    # + class.code.where($this = 'EMER').count() * 9203
    confidence: 1.0

  - upstream:
      platform: s3
      name: sharing_layer_Encounter.ndjson
      env: PROD
      fieldPath: class.display
    downstream:
      platform: postgres
      name: omop_public_visit_occurrence
