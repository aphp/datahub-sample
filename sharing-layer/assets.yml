    nativeDataType: http://hl7.org/fhirpath/System.String
    partOfKey: true
  - fieldPath: gender
    type: string
    nullable: true
    description: >
        Sexe administratif du patient. Valeurs FHIR : male | female | other | unknown.
    nativeDataType: http://hl7.org/fhirpath/System.String

  - fieldPath: birthDate
    type: date
    nullable: true
    description: >
            Date de naissance du patient au format FHIR (YYYY, YYYY-MM, ou YYYY-MM-DD).
    nativeDataType: http://hl7.org/fhirpath/System.Date

  - fieldPath: deceased
    type: date
    nullable: true
    description: >
      Date et heure de décès du patient, présente uniquement si le patient
      est décédé et que la date est connue. Polymorphisme FHIR :
      Patient.deceased[x] peut être boolean ou dateTime —
      seul le type dateTime est exploité ici.
      Sert de filtre d'existence (deceased.ofType(dateTime).exists())
      pour la table OMOP Death.
    nativeDataType: http://hl7.org/fhirpath/System.DateTime

  - fieldPath: address.extension[geolocation].extension[latitude].valueDecimal
    type: number
    nullable: true
    description: >
      Latitude GPS extraite de l'extension FHIR standard geolocation,
      sous-extension latitude, sur le premier élément de Patient.address.
      URL : http://hl7.org/fhir/StructureDefinition/geolocation.
    nativeDataType: http://hl7.org/fhirpath/System.Decimal

  - fieldPath: address.extension[geolocation].extension[longitude].valueDecimal
    type: number
    nullable: true
    description: >
      Longitude GPS extraite de l'extension FHIR standard geolocation,
      sous-extension longitude, sur le premier élément de Patient.address.
      URL : http://hl7.org/fhir/StructureDefinition/geolocation.
