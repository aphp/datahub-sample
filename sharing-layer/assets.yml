kind: DATA_FLOW
orchestrator: airflow
flowId: "postgres_semantic_layer_to_s3_sharing_layer"
cluster: "PROD"
name: "Semantic layer to Sharing layer"
description: >
  Pipeline Airflow de transformation des données cliniques de l'EHR
  vers le raw layer.
project: "semanticlayer2sharinglayer"
externalUrl: "https://gitlab.example.org/eds/ehr_to_fhir_semantic_layer"
domains: "c8eda4574cd1f980d8a5d1a2e72148b4"
#subTypes: "DBT"
owners:
  - owner: "eds-data-engineering"
    type: "TECHNICAL_OWNER"
  - owner: "eds-interoperability"
    type: "BUSINESS_OWNER"
---
kind: DATA_JOB
jobId: "semantic_layer_fhir_patient_to_sharing_layer"
dataFlow:
  orchestrator: airflow
  flowId: "postgres_semantic_layer_to_s3_sharing_layer"
  cluster: "PROD"
name: "PostgreSQL semantic_layer fhir_patient → S3 sharing_layer Patient.ndjson"
description: >
  Export de la table semantic_layer_public.fhir_patient (PostgreSQL) vers
  le fichier sharing_layer_Patient.ndjson (S3) au format NDJSON FHIR R4.
  Aucune transformation métier : toutes les colonnes sont recopiées à
  l'identique (IDENTITY). Alimente la sharing layer avec les ressources
  FHIR Patient sérialisées pour exposition et partage externe.
type: "RawCopy"

inputDatasets:
  - platform: postgres
    name: semantic_layer_public_fhir_patient
    env: PROD

outputDatasets:
  - platform: s3
    name: sharing_layer_Patient.ndjson
    env: PROD

fineGrainedLineages:
  - upstream:
      platform: postgres
      name: semantic_layer_public_fhir_patient
      env: PROD
      fieldPath: fhir_id
    downstream:
      platform: s3
      name: sharing_layer_Patient.ndjson
      env: PROD
      fieldPath: id
    operation: "IDENTITY"
    confidence: 1.0

  - upstream:
