kind: DATASET
name: omop_public_measurement
platform: postgres
env: PROD
displayName: Measurement
description: >
  Table OMOP CDM Measurement alimentée par deux jobs distincts :
  - measurement_blood_pressure : Observations avec composants (forEach component),
    measurement_event_id peuplé, range_low/range_high null.
  - measurement_simple : Observations scalaires (component.exists().not()),
    valueQuantity et referenceRange au niveau racine, measurement_event_id null.
  Le measurement_concept_id est fixé à 0 (mapping vocabulaire OMOP non réalisé).
container:
  platform: postgres
  instance: postgres
  database: omop
  schema: public
  env: PROD
schema:
  fields:
    - fieldPath: measurement_id
      type: string
      nullable: false
      description: >
        Identifiant unique de la mesure dans OMOP CDM.
        Dérivé du FHIR Observation.id.
      nativeDataType: varchar
      partOfKey: true

    - fieldPath: person_id
      type: string
      nullable: false
      description: >
        Référence à la personne concernée.
        Dérivé de Observation.subject.reference.
      nativeDataType: varchar

    - fieldPath: visit_occurrence_id
      type: string
      nullable: true
      description: >
        Référence à la visite parente dans visit_occurrence.
        Dérivé de Observation.encounter.reference.
      nativeDataType: varchar

    - fieldPath: visit_detail_id
      type: string
      nullable: true
      description: >
        Référence au détail de visite dans visit_detail.
        Dérivé de Observation.encounter.reference — relation 1:1 dans ce modèle.
      nativeDataType: varchar

    - fieldPath: measurement_date
      type: date
      nullable: true
      description: >
        Date de la mesure (partie date uniquement),
        dérivée de Observation.effectiveDateTime par troncature de l'heure.
      nativeDataType: date

    - fieldPath: measurement_concept_id
      type: number
      nullable: false
      description: >
        Concept OMOP standard de la mesure.
        Valeur constante 0 — mapping vers vocabulaire OMOP non encore réalisé.
      nativeDataType: integer

    - fieldPath: measurement_source_value
      type: string
      nullable: true
      description: >
        Libellé source de la mesure.
        measurement_blood_pressure : component.code.coding.first().display.
        measurement_simple : code.coding.first().display.
      nativeDataType: varchar

    - fieldPath: measurement_source_concept_id
      type: string
      nullable: true
      description: >
        Code source de la mesure.
        measurement_blood_pressure : component.code.coding.first().code.
        measurement_simple : code.coding.first().code.
      nativeDataType: varchar

    - fieldPath: measurement_coding_source_system
      type: string
      nullable: true
      description: >
        Système de codage source de la mesure.
        measurement_blood_pressure : component.code.coding.first().system.
        measurement_simple : code.coding.first().system.
      nativeDataType: varchar

    - fieldPath: measurement_type_concept_id
      type: number
      nullable: false
      description: >
        Concept OMOP représentant l'origine de l'enregistrement.
        Valeur constante 44818702 ("Lab result") — aucun champ source FHIR.
      nativeDataType: integer

    - fieldPath: measurement_event_id
      type: string
      nullable: true
      description: >
        Référence à l'événement source de la mesure.
        Peuplé uniquement par measurement_blood_pressure (Observation.id).
        Null pour measurement_simple.
      nativeDataType: varchar

    - fieldPath: value_as_number
      type: number
      nullable: true
      description: >
        Valeur numérique de la mesure (where($this is Quantity)).
        measurement_blood_pressure : component.valueQuantity.value.
        measurement_simple : valueQuantity.value.
      nativeDataType: numeric

    - fieldPath: unit_concept_id
      type: string
      nullable: true
      description: >
        Code UCUM de l'unité de mesure.
        measurement_blood_pressure : component.valueQuantity.code.
        measurement_simple : valueQuantity.code.
      nativeDataType: varchar

    - fieldPath: unit_source_value
      type: string
      nullable: true
      description: >
        Libellé source de l'unité de mesure.
        measurement_blood_pressure : component.valueQuantity.unit.
        measurement_simple : valueQuantity.unit.
      nativeDataType: varchar

    - fieldPath: range_low
      type: number
      nullable: true
      description: >
        Borne basse de la plage de référence,
        issue de Observation.referenceRange.first().low.value.
        Peuplé uniquement par measurement_simple.
        Null pour measurement_blood_pressure.
      nativeDataType: numeric

    - fieldPath: range_high
      type: number
      nullable: true
      description: >
        Borne haute de la plage de référence,
        issue de Observation.referenceRange.first().high.value.
        Peuplé uniquement par measurement_simple.
        Null pour measurement_blood_pressure.
      nativeDataType: numeric

