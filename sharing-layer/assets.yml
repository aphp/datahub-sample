    - fieldPath: visit_detail_id
      type: string
      nullable: true
      description: >
        Référence au détail de visite dans visit_detail.
        Dérivé de Condition.encounter.reference — relation 1:1 dans ce modèle.
      nativeDataType: varchar

    - fieldPath: condition_start_date
      type: date
      nullable: true
      description: >
