assertion:
  type: SQL
  entityUrn: "urn:li:dataset:(urn:li:dataPlatform:postgres,ehr_public_patient,PROD)"
  sqlType: METRIC
  statement: "SELECT COUNT(*) FROM public.patient WHERE updated_at >= NOW() - INTERVAL '24 hours'"
  operator: GREATER_THAN
  value: 0
  changeType: ABSOLUTE
