kind: DATA_PRODUCT
id: "63073b282083f5bd1a437525b906d72c"
name: "Biologie"

description: |
  ## À quoi correspondent ces données ?

  Les données de biologie correspondent aux résultats des examens réalisés dans les laboratoires de l'AP-HP.

  Tous les résultats disponibles dans l'EDS sont issus du logiciel de biologie GLIMS® où ils ont été validés biologiquement.

  ## À quoi servent ces données ?

  Les résultats de biologie constituent un élément essentiel du diagnostic et du suivi clinique.
  **Dans l'EDS, ils sont utilisés pour :**

  *   identifier des groupes de patients à partir de critères biologiques,
  *   mener des projets de recherche,
  *   contribuer au pilotage de certaines activités de laboratoire.

  ## Que contiennent ces données ?

  Chaque analyse comprend :

  *   un **type d'examen** (ex. glucose, lipase),
  *   une **valeur de résultat** : numérique (ex. 120) ou textuelle (ex. présence/absence),
  *   l'**unité de mesure** (ex. mmol/L),
  *   des **valeurs de référence** (quand elles sont disponibles),
  *   la **date de validation biologique**,
  *   un **code ANABIO**, identifiant unique de l'analyse propre au référentiel interne de l'AP-HP (81% des analyses enregistrées sont associées à un code ANABIO),
  *   un **code LOINC**, identifiant unique propre au référentiel international LOINC (61% des analyses enregistrées sont associées à un code LOINC).

  ## D'où viennent les données ?

  Les données proviennent **du logiciel de biologie GLIMS©**, le système d'information de biologie médicale utilisé dans l'AP-HP.

  Les données sont intégrées dans l'EDS avec une **actualisation quotidienne**.

  ## Quelles données sont disponibles dans l'EDS ?

  **Les données de biologie de l'EDS incluent :**

  *   les données de biochimie,
  *   les données d'hématologie,
  *   les données d'immunologie,
  *   les données sérologiques,
  *   les données de biologie moléculaire en bactériologie, mycologie, virologie et parasitologie.

  **Elles excluent pour le moment :**

  *   les données de culture en bactériologie, mycologie et parasitologie,
  *   les données génétiques.

  Les dates de disponibilité des données diffèrent selon les sites, dépendant du calendrier de déploiement de GLIMS® et du remplacement de systèmes antérieurs (DxLab). Les données les plus anciennes sont actuellement disponibles **à partir de mars 2020**.

  ## Comment sont-elles reliées au patient ?

  Les résultats d'examens sont rattachés à un **séjour hospitalier** (par le Numéro de Dossier Administratif) et à une **unité médicale**.
  Cela permet de les croiser avec les actes médicaux réalisés, les diagnostics, les médicaments prescrits et administrés, et les documents médicaux produits pendant le séjour.

  Attention, ce rattachement peut être plus difficile pour les **consultations externes** (NDA ouvert en continu) ou les **hospitalisations longues** avec transfert entre différents services.

  ## Ce qu'il faut savoir avant de les utiliser

  *   **Évolution du référentiel ANABIO** : référentiel interne de l'AP-HP aligné sur LOINC, mais cet alignement n'est pas encore complet. De nouveaux concepts sont régulièrement créés (ex. variants COVID, nouveaux marqueurs). Il faut tenir compte de ces évolutions dans les analyses longitudinales.
  *   **Multiplicité des codes pour un même examen** : une même analyse biologique peut exister sous plusieurs codes ANABIO ou LOINC (normes différentes, automates différents, réactifs différents), ce qui peut compliquer la recherche des résultats d'un examen.

