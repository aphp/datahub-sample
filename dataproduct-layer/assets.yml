kind: DATA_PRODUCT
id: "b720bd422a11c5da1336c4da5e137067"
name: "FHIR Standardized Patient Identity"
description: |
  Le produit donnée **FHIR Standardized Patient Identity** fournit une représentation normalisée, qualifiée et réutilisable de l’identité patient, destinée à faciliter les échanges, l’intégration et la valorisation des données au sein du système d'information hospitalier et des plateformes de données.

  Les données sources proviennent du dossier patient informatisé (DPI) et des référentiels d'identité associés. Elles regroupent les informations d'identification du patient, telles que les identifiants métier et nationaux, les éléments d'état civil, les coordonnées, ainsi que les liens de rapprochement et de gestion d'identité lorsque ceux-ci sont disponibles.

  Avant leur exposition, les données font l'objet d'un ensemble de traitements visant à garantir leur qualité et leur cohérence :

  * contrôle de complétude des informations obligatoires ;
  * vérification des règles de gestion et des contraintes métier ;
  * qualification des identifiants ;
  * normalisation des valeurs et des formats ;
  * gestion des incohérences détectées lors des processus d'identitovigilance.

  Les données qualifiées sont ensuite transformées selon le modèle d'information HL7 FHIR afin de produire des ressources conformes aux profils de référence définis par l'organisation. Cette standardisation permet de proposer une vue canonique, interopérable et indépendante des applications sources, facilitant ainsi la réutilisation des données pour des usages opérationnels, analytiques, réglementaires, de recherche ou de partage inter-établissements.

  Ce Data Product constitue le point d'accès de référence pour les consommateurs souhaitant exploiter les données d'identité patient sous une forme standardisée, gouvernée et prête à l'usage.

