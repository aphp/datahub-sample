  fr.aphp.panorama.note-cohort360: |
    ## Pour accéder aux données de votre patientèle

    *   Les données sont exploitables dans **Cohort360**, un outil de requêtage, **visualisation et d'extraction en ligne**, qui permet :

        *   Un usage **autonome et sécurisé** des données,
        *   L'accès aux **données nominatives** des patients suivis dans votre service.

    *   L'outil est accessible à **tous les praticiens de l'AP-HP** pour analyser leur propre activité clinique.

    *   **Conditions d'accès** : Disponible **immédiatement après une formation en ligne** à l'utilisation de l'outil.

    **Informations spécifiques à l'exploitation des données dans Cohort360 :**

    *   Selon le type de données, les éléments seront retranscrits au niveau de l'hôpital ou de l'UF. Les UC/UH ne sont pas prises en compte dans l'outil.

    [Contacter un référent](https://eds.aphp.fr/coordinateurs-et-data-scientists/)

    [En savoir plus sur Cohort360](https://eds.aphp.fr/nos-produits/#cohort)
  fr.aphp.panorama.note-datalab: |
    ## Pour la recherche

    *   L'accès aux données de l'EDS dans le cadre d'un projet de recherche nécessite **un examen par le Comité Scientifique et Éthique (CSE) de l'AP-HP**. Il est nécessaire de constituer et déposer un dossier complet (contenant notamment un plan d'analyse des risques, signé par le DPO local) via l'URC.

        *   **Délai** : En fonction du type de projet, un ou plusieurs mois peuvent s'écouler entre la soumission du projet et la mise à disposition des données.

    *   Les données sont **pseudonymisées** pour garantir la confidentialité des patients.

        *   Elles sont accessibles dans **un environnement sécurisé**, équipé d'outils pour l'analyse de données massives (notamment un espace **Jupyter**).

    *   Ce cadre s'applique aussi aux **projets menés avec des partenaires extérieurs**.

    [Contacter un référent](https://eds.aphp.fr/coordinateurs-et-data-scientists/)

    [En savoir plus sur Datalab](https://eds.aphp.fr/nos-produits/#datalab)
  fr.aphp.panorama.note-pilote: |
    ## Pour le pilotage de votre activité

    *   Les données sont présentées sous forme de **tableaux de bord automatisés** dans le portail **Pilote**, avec possibilité de filtrer sur les services de l'AP-HP.

    *   Les tableaux de bords agrégés sont accessibles **aux services cliniques et directions fonctionnelles de l'AP-HP**. L'accès aux tableaux de bord fournissant des données nominatives est restreint au périmètre de soin.

    *   La priorisation de création de nouveaux tableaux de bord
