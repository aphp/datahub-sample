kind: DATA_PRODUCT
id: "4c00c11dc1b03221ab639760f93f5821"
name: "Actes médicaux"

description: |
  ## À quoi correspondent ces données ?

  Les données d'actes médicaux décrivent les **gestes et interventions réalisés par les praticiens** au cours de la prise en charge d'un patient, depuis l'électrocardiogramme jusqu'à la transplantation cardiaque. Ces informations sont saisies lors de la réalisation de l'acte, que ce soit lors d'une hospitalisation ou d'une consultation externe.

  ## À quoi servent ces données ?

  Les données d'actes servent principalement à :

  *   **valoriser les séjours hospitaliers** (facturation externe et tarification du Programme de Médicalisation des Systèmes d'Information (PMSI)),
  *   **mesurer l'activité médicale** des établissements,
  *   **alimenter la recherche clinique** et les analyses de parcours de soins en permettant d'identifier des groupes de patients selon les actes qu'ils ont reçus.

  ## Que contiennent ces données ?

  Dans l'EDS, chaque acte est décrit à l'aide de plusieurs informations :

  *   **Code CCAM** : les données d'actes médicaux sont codées selon la Classification Commune des Actes Médicaux (CCAM), produite par l'assurance maladie. Chaque acte correspond à un identifiant officiel CCAM : par exemple EGLF001 = pose d'un cathéter veineux ombilical,
  *   **Date de saisie** : le jour d'enregistrement de l'acte.

  ## D'où viennent les données ?

  L'EDS met à disposition les données d'actes issues de la base AREM ainsi que celles issues de la base ORBIS®.

  La base AREM est la version consolidée et contrôlée par les Départements d'Information Médicale (DIM) des données PMSI issues du logiciel de dossier patient informatisé ORBIS®.

  **Délai de disponibilité** : les données sont accessibles **environ 2 mois après leur enregistrement**, le temps nécessaire pour leur codage, leur validation et leur transmission.

  ## Quelles données sont disponibles dans l'EDS ?

  **Les données d'actes médicaux de l'EDS couvrent :**

  *   les séjours de médecine, chirurgie et obstétrique (MCO),
  *   en hospitalisation complète ou partielle,
  *   les consultations externes.

  **Elles excluent pour le moment :**

  *   la psychiatrie (PSY),
  *   l'hospitalisation à domicile (HAD),
  *   les soins de longue durée (SLD),
  *   les données de l'Hôpital Européen Georges-Pompidou (HEGP),
  *   les données produites avant le déploiement d'ORBIS® dans chaque établissement.

  ## Comment sont-elles reliées au patient ?

  Chaque acte médical est rattaché à un **séjour hospitalier** (par le Numéro de Dossier Administratif) et à une **unité médicale**.
  Cela permet de les croiser avec les diagnostics, les résultats d'analyses de biologie, les médicaments et les documents médicaux produits pendant le séjour.

  Les actes dits _externes_ (réalisés hors hospitalisation, par exemple une radio ou une prise de sang) sont reliés uniquement au Numéro de Dossier Administratif.

  ## Note sur l'exploitation des données d'ORBIS®

  Bien que les données issues de la base AREM soient généralement suffisantes, il est possible d'**exploiter directement les données issues d'ORBIS®**, actualisées **quotidiennement**.

  Ces données permettent une couverture étendue : elles incluent les actes CCAM pour la psychiatrie (PSY), l'hospitalisation à domicile (HAD) et les soins de longue durée (SLD), ainsi que l'heure d'enregistrement des actes.
  Cependant elles **ne sont pas soumises au contrôle de conformité ou de qualité** des DIM, et ne sont pas disponibles depuis la même date pour tous les hôpitaux.

