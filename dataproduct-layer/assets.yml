kind: DATA_PRODUCT
id: "332168b7470838bba4325ea913c8be42"
name: "Diagnostics"

description: |
  ## À quoi correspondent ces données ?

  Les données de diagnostics médicaux décrivent les motifs de prise en charge des patients pendant une venue ou un séjour à l'hôpital.

  Ces diagnostics sont recueillis en majorité dans le cadre du Programme de Médicalisation des Systèmes d'Information (PMSI) ; ils participent au recueil des données obligatoires pour la facturation des hospitalisations.

  ## À quoi servent ces données ?

  **Les données de diagnostics servent principalement à :**

  *   valoriser les séjours hospitaliers (arrêté versement PMSI),
  *   mesurer l'activité médicale des établissements,
  *   alimenter la recherche clinique et les analyses de parcours de soins, en identifiant des groupes de patients selon les diagnostics renseignés.

  ## Que contiennent ces données ?

  Dans l'EDS, **chaque diagnostic est décrit à l'aide de plusieurs informations**, notamment :

  *   le **code CIM-10** : les données de diagnostics sont codées selon la Classification Internationale des Maladies (CIM-10). Chaque diagnostic est associé à un code CIM-10,
  *   le **libellé du diagnostic CIM-10** (par exemple le code "I10" est relié au libellé "Hypertension essentielle"),
  *   la **date de saisie** du code.

  Dans le cadre du recueil PMSI, on distingue plusieurs types de diagnostics : le diagnostic principal (motif d'hospitalisation) et les diagnostics associés (diagnostics reliés ou associés), qui sont des pathologies complémentaires prises en charge au cours de l'hospitalisation.

  ## D'où viennent les données ?

  L'EDS met à disposition les données de diagnostics issues de la base AREM ainsi que celles issues de la base ORBIS®.

  La base AREM est la version consolidée et contrôlée par les Départements d'Information Médicale (DIM) des données PMSI issues d'ORBIS®.

  **Délai de disponibilité** : les données sont accessibles **environ 2 mois après leur enregistrement**, le temps nécessaire pour leur codage, leur validation et leur transmission.

  ## Quelles données sont disponibles dans l'EDS ?

  **Les données de diagnostics disponibles dans l'EDS couvrent :**

  *   les séjours de médecine, chirurgie et obstétrique (MCO),
  *   en hospitalisation complète ou partielle.

  **Elles excluent pour le moment :**

  *   les consultations externes (sans hospitalisation),
  *   la psychiatrie (PSY),
  *   l'hospitalisation à domicile (HAD),
  *   les passages aux urgences,
  *   les soins Médicaux et de Réadaptation (SMR),
  *   les soins de longue durée (SLD),
  *   les données de l'hôpital européen Georges-Pompidou (HEGP),
  *   les données produites avant le déploiement d'ORBIS® dans chaque établissement.

  ## Comment sont-elles reliées au patient ?

  Chaque diagnostic est rattaché à un **séjour hospitalier** (par le Numéro de Dossier Administratif) et à une **unité médicale**.
  Cela permet de les croiser avec les actes médicaux réalisés, les résultats d'analyses de biologie, les médicaments prescrits et administrés, et les documents médicaux produits pendant le séjour.

  ## Note sur l'exploitation des données d'ORBIS®

  Bien que les données issues de la base AREM soient généralement suffisantes, il est possible d'**exploiter directement les données issues d'ORBIS®**, actualisées **quotidiennement**.

  Ces données permettent une couverture étendue (MCO, PSY, HAD, SLD) et incluent l'heure d'enregistrement des diagnostics.
  Cependant elles **ne sont pas soumises au contrôle de conformité ou de qualité** des DIM, et ne sont pas disponibles depuis la même date pour tous les hôpitaux.

