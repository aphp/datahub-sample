kind: DATA_PRODUCT
id: "0f61491882d0ea5ea6a501521d937e9b"
name: "OMOP Standardized Patient Identity"
description: |
  Le Data Product **OMOP Standardized Patient Identity** fournit une représentation de l'identité patient conforme au modèle de données OMOP Common Data Model (CDM), destinée aux usages analytiques, de recherche et de valorisation des données de santé.

  Ce Data Product s'appuie sur les données issues du Data Product **FHIR Standardized Patient Identity**, qui constitue sa source de référence. Les ressources FHIR standardisées sont transformées et alignées avec les structures et conventions du modèle OMOP afin de garantir une représentation cohérente et exploitable dans les environnements d'analyse de données de santé.

  Les traitements réalisés incluent :

  * l'extraction des informations pertinentes à partir des ressources FHIR ;
  * l'application des règles de correspondance entre les modèles FHIR et OMOP ;
  * la normalisation des identifiants et des concepts ;
  * le contrôle de cohérence des données produites ;
  * l'intégration dans les structures du modèle OMOP CDM.

  Les données résultantes sont exposées sous une forme compatible avec les outils et méthodologies de l'écosystème OMOP, facilitant les analyses multicentriques, les études observationnelles, la recherche clinique et les travaux de science des données.

  Ce Data Product constitue la couche d'accès de référence pour les consommateurs souhaitant exploiter les données d'identité patient dans un environnement analytique reposant sur le standard OMOP, tout en bénéficiant de la gouvernance et de la standardisation assurées en amont par le socle FHIR.

