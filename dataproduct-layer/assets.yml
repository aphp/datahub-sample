kind: DATA_PRODUCT
id: "061829895620992279f0890af4617db9"
name: "Imagerie médicale"

description: |
  ## À quoi correspondent ces données ?

  Les données d'imagerie de l'EDS regroupent les images produites lors des examens d'imagerie dans les hôpitaux de l'AP-HP (imagerie médicale, médecine nucléaire,...) et les métadonnées associées, par exemple des informations sur le patient, le service, la date ou les paramètres techniques.

  **Le compte rendu qui peut être associé aux examens d'imagerie n'est pas décrit dans cette page.**
  Voir la page Les documents médicaux pour en savoir plus.

  ## À quoi servent ces données ?

  Dans l'EDS, les données d'imagerie peuvent être réutilisées à des fins de recherche, de suivi de patients au sein des services cliniques, ou de pilotage de l'activité.

  **Les métadonnées d'imagerie permettent notamment :**

  *   l'identification des groupes de patients,
  *   le suivi de l'activité d'imagerie dans un cadre de pilotage ou d'évaluation interne.

  **Les images elles-mêmes, moins accessibles et plus coûteuses à exploiter, permettent notamment :**

  *   le développement d'algorithmes de traitement d'image.

  ## Que contiennent ces données ?

  Chaque examen d'imagerie comprend généralement deux types d'informations.

  *   **Les images d'examen :** les fichiers issus de l'examen au format DICOM, pouvant correspondre à des images 2D, 3D ou des vidéos.
  *   **Les métadonnées d'examen qui comprennent entre autres :**
      *   la date et l'heure de l'examen,
      *   le service dans lequel il a été réalisé,
      *   la modalité d'imagerie (Scanner, IRM, mammographie,...),
      *   les paramètres d'acquisition de la machine.

  ## D'où viennent les données ?

  Les données d'imagerie de l'EDS proviennent du **PACS central de l'AP-HP**, système d'archivage et de transmission des images médicales. Il est utilisé pour permettre aux cliniciens en radiologie d'interpréter les résultats et de produire les comptes rendus pour le patient et les services cliniques prescripteurs.

  ## Quelles données sont disponibles dans l'EDS ?

  ### 1. Les images

  *   Les images DICOM sont accessibles **uniquement dans le cadre de projets de recherche validés**.
  *   Elles concernent principalement les examens suivants : scanner, IRM, TEP, mammographie.

  **Certaines modalités ne sont pas encore intégrées** dans l'EDS sous forme d'images, notamment :

  *   les échographies,
  *   les examens d'ophtalmologie.

  ### 2. Les métadonnées

  Contrairement aux images, les métadonnées associées aux examens sont facilement disponibles que ce soit pour un projet de recherche, de pilotage ou de suivi de sa propre patientèle.

  Elles couvrent notamment les examens de : scanner, IRM, TEP, radiographie, échographie.

  **Les autres types d'imagerie sont soumis à une étude de faisabilité avant mise à disposition.**

  ## Comment sont-elles reliées au patient ?

  Les examens d'imagerie sont rattachés à un **patient** (par l'Identifiant Permanent du Patient (IPP) à l'AP-HP), ce qui permet d'associer chaque image ou série d'images à la bonne personne dans l'EDS.

  À noter que 20% des examens d'imagerie ne sont pas correctement rattachés à un patient.

  Lorsque ce lien est disponible, il permet de croiser les données d'imagerie avec les diagnostics et les actes médicaux.

  ## Ce qu'il faut savoir avant de les utiliser

  *   **Champs en texte libre** : certains champs de métadonnées (ex. localisation anatomique) sont renseignés librement par les praticiens, ce qui peut limiter la standardisation.
  *   **Lien incomplet entre examen, séjour et compte rendu** : les examens étant peu souvent rattachés à une visite ou un séjour, il est difficile de lier systématiquement un examen à son compte rendu.
  *   **Complexité au-delà des métadonnées simples** : l'exploitation de tout ce qui dépasse les métadonnées simples est très complexe et nécessite un examen approfondi de la demande.
  *   **Historique variable** : bien que l'historique débute en 2005, les données ne sont pas disponibles depuis la même date pour tous les établissements.

