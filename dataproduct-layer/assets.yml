    [En savoir plus sur Datalab](https://eds.aphp.fr/nos-produits/#datalab)
  fr.aphp.panorama.note-pilote: |
    ## Pour le pilotage de votre activité

    *   Les données sont présentées sous forme de **tableaux de bord automatisés** dans le portail **Pilote**, avec possibilité de filtrer sur les services de l'AP-HP.

    *   Les tableaux de bords agrégés sont accessibles **aux services cliniques et directions fonctionnelles de l'AP-HP**. L'accès aux tableaux de bord fournissant des données nominatives est restreint au périmètre de soin.

    *   La priorisation de création de nouveaux tableaux de bord est effectuée par la gouvernance Données de l'EDS (COPIL, Club utilisateurs…).

    *   Les tableaux de bord permettent selon leur périmètre :

        *   D'**analyser l'activité d'un service**,
        *   De **suivre des indicateurs de qualité relative à la prise en charge des patients**,
        *   De suivre des indicateurs épidémiologiques (suivi des décès, suivi des infections respiratoires virales,...).

    *   **Mise à jour** : Les tableaux de bord sont **actualisés quotidiennement**.

    **Informations spécifiques à l'exploitation des données dans Pilote :**

    *   Dans Pilote, pour le moment, il n'est possible d'exploiter que les données de virologie (pour les analyses des épidémies respiratoires) et les données de bactériologie (pour les analyses de bactéries hautement résistantes).

    [En savoir plus sur Pilote](https://eds.aphp.fr/nos-produits/#pilote)

    [Accéder à l'outil](https://pilote.aphp.fr/ibmcognos/bi/)

