kind: DATA_FLOW
orchestrator: airflow
flowId: "ehr_to_duckdb_raw_layer"
cluster: "PROD"
name: "EHR to duckDB Raw Layer"
description: >
  Pipeline Airflow de transformation des données cliniques de l'EHR
  vers le raw layer.
project: "ehr2rawlayer"
externalUrl: "https://gitlab.example.org/eds/ehr_to_fhir_semantic_layer"
domains: "c8eda4574cd1f980d8a5d1a2e72148b4"
#subTypes: "DBT"
owners:
  - owner: "eds-data-engineering"
    type: "TECHNICAL_OWNER"
  - owner: "eds-interoperability"
    type: "BUSINESS_OWNER"
---
kind: DATA_JOB
jobId: "ehr_patient_to_raw_layer"
dataFlow:
  orchestrator: airflow
  flowId: "ehr_to_duckdb_raw_layer"
  cluster: "PROD"
name: "EHR Patient → DuckDB raw-layer patient"
description: >
  Copie brute de la table ehr_public_patient (PostgreSQL) vers
  warehouse.raw-layer.patient (DuckDB). Aucune transformation métier :
  toutes les colonnes sont recopiées à l'identique (IDENTITY).
  Alimente la raw-layer du data warehouse AP-HP pour les traitements
  analytiques et FHIR aval.
type: "RawCopy"

inputDatasets:
  - platform: postgres
    name: ehr_public_patient
    env: PROD

outputDatasets:
  - platform: duckdb
    name: warehouse_raw-layer_patient
    env: PROD

fineGrainedLineages:
  - upstream:
      platform: postgres
      name: ehr_public_patient
      env: PROD
      fieldPath: patient_id
    downstream:
      platform: duckdb
      name: warehouse_raw-layer_patient
      env: PROD
      fieldPath: patient_id
    operation: "IDENTITY"
