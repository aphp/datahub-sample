kind: DATASET
name: transform_layer_fhir_procedure
platform: dbt
env: PROD
description: 'Ressource FHIR Procedure issue de la transformation EHR→FSL décrite
  dans StructureMap-EHR2FSL.fml (groupe TransformProcedure). Une ligne par acte CCAM
  (actes), jointure avec fhir_patient et fhir_encounter.'
container:
  platform: dbt
  instance: dbt
  database: transform_layer
  env: PROD
schema:
  fields:
    - fieldPath: fhir_id
      type: string
      description: Identifiant FHIR (uuid généré)
      nativeDataType: UUID
      partOfKey: true
    - fieldPath: identifier_acte_value
      type: number
      description: Identifiant EHR de l'acte (system=https://hospital.eu/ehr/acte-id)
      nativeDataType: DOUBLE PRECISION
      partOfKey: false
    - fieldPath: status
      type: string
      description: Statut FHIR — toujours 'completed' pour les actes historiques
      nativeDataType: VARCHAR
      partOfKey: false
    - fieldPath: code_ccam
      type: string
      description: Code CCAM de l'acte (code.coding.code)
      nativeDataType: VARCHAR
      partOfKey: false
    - fieldPath: code_text
      type: string
      description: Libellé de l'acte (code.text)
      nativeDataType: VARCHAR
      partOfKey: false
    - fieldPath: subject_patient_id
      type: number
      description: fhir_id du patient FHIR (FK vers fhir_patient.fhir_id)
      nativeDataType: BIGINT
      partOfKey: false
    - fieldPath: encounter_id
      type: number
      description: fhir_id de l'encounter FHIR (FK vers fhir_encounter.fhir_id)
      nativeDataType: BIGINT
      partOfKey: false
    - fieldPath: performed_date_time
      type: date
      description: Date de réalisation de l'acte (performed[x] = performedDateTime)
      nativeDataType: TIMESTAMP
      partOfKey: false
    - fieldPath: performer_actor_practitioner_text
      type: string
      description: Exécutant de l'acte (performer.actor.display)
      nativeDataType: VARCHAR
      partOfKey: false
