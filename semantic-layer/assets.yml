#urn: "urn:li:dataset:(urn:li:dataPlatform:postgres,semantic_layer.public.fhir_patient,PROD)"
kind: DATASET
name: semantic_layer_public_fhir_patient
platform: postgres
env: PROD
description: "Ressource FHIR Patient (profil DMPatient) — Profil Patient du socle commun des EDS. Données démographiques et administratives sur un individu recevant des soins, incluant les identifiants INS-NIR et NSS, la géolocalisation d'adresse et les extensions françaises (source du décès, code géographique PMSI)."
container:
  platform: postgres
  instance: postgres
  database: semantic_layer
  schema: public
  env: PROD
schema:
  fields:
    - fieldPath: id
      type: string
      description: Identifiant unique de la ressource FHIR Patient (clé primaire)
      nativeDataType: VARCHAR(64)
      partOfKey: true
    - fieldPath: last_updated
      type: date
      description: Date et heure de dernière mise à jour de la ressource
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
    - fieldPath: active
      type: boolean
      description: Indique si le dossier patient est en cours d'utilisation active
      nativeDataType: BOOLEAN
      partOfKey: false
    - fieldPath: identifiers
      type: record
      description: Tableau d'objets Identifier — identifiants métier du patient (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: nss_identifier
      type: string
      description: NSS — Numéro de Sécurité Sociale (13 à 15 chiffres, format ^[0-9]{13,15}$)
      nativeDataType: VARCHAR(50)
      partOfKey: false
    - fieldPath: ins_nir_identifier
      type: string
      description: INS-NIR — Identifiant national de santé obtenu depuis le téléservice INSi (15 chiffres, format ^[0-9]{15}$)
      nativeDataType: VARCHAR(15)
      partOfKey: false
    - fieldPath: names
      type: record
      description: Noms associés au patient — tableau d'objets HumanName FHIR (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: full_names
      type: string
      description: Représentation structurée du nom du patient, sérialisée en texte
      nativeDataType: TEXT
      partOfKey: false
    - fieldPath: gender
      type: string
      description: Sexe administratif — male | female | other | unknown
      nativeDataType: VARCHAR(10)
      partOfKey: false
    - fieldPath: birth_date
      type: date
      description: Date de naissance de l'individu (>= 1900-01-01)
      nativeDataType: DATE
      partOfKey: false
    - fieldPath: deceased_x
      type: record
      description: Indique si l'individu est décédé (booléen ou dateTime) — FHIR deceased[x]
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: deceased_date_time
      type: date
      description: Date et heure du décès (>= birth_date)
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
    - fieldPath: deceased_extension_death_source
      type: string
      description: Source de l'information de décès — insee | cepidc | sih
      nativeDataType: VARCHAR(10)
      partOfKey: false
    - fieldPath: marital_status
      type: string
      description: Statut marital (civil) du patient — PACS | A | D | I | L | M | C | P | T | U | S | W | UNK
      nativeDataType: VARCHAR(4)
      partOfKey: false
    - fieldPath: address
      type: record
      description: Adresses physiques de l'individu (domicile, travail, temporaire, etc.) — FHIR Address (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: address_extension_geolocation_latitude
      type: number
      description: Latitude pour la géolocalisation de l'adresse du patient (entre -90 et 90)
      nativeDataType: FLOAT
      partOfKey: false
    - fieldPath: address_extension_geolocation_longitude
      type: number
      description: Longitude pour la géolocalisation de l'adresse du patient (entre -180 et 180)
      nativeDataType: FLOAT
      partOfKey: false
    - fieldPath: address_extension_census_tract
      type: string
      description: Code et libellé IRIS de la zone de recensement (extension ISO 21090 ADXP census tract)
      nativeDataType: VARCHAR(255)
      partOfKey: false
    - fieldPath: address_period_start
      type: date
      description: Date de début de validité de l'adresse pour le suivi de collecte de données
      nativeDataType: DATE
      partOfKey: false
    - fieldPath: address_extension_pmsi_code_geo
      type: record
      description: Extension code géographique PMSI pour la localisation de l'établissement de santé français
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: address_extension_pmsi_code_geo_code
      type: string
      description: Valeur du code géographique PMSI à des fins administratives (2 à 5 chiffres, format ^[0-9]{2,5}$)
      nativeDataType: VARCHAR(5)
      partOfKey: false
    - fieldPath: telecoms
      type: record
      description: Coordonnées de l'individu (téléphone, email, fax, etc.) — FHIR telecom ContactPoint (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: contacts
      type: record
      description: Contacts d'urgence et tuteurs du patient — FHIR contact BackboneElement (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: communications
      type: record
      description: Langues dans lesquelles le patient peut communiquer — FHIR communication BackboneElement (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: preferred_communication_languages
      type: string
      description: Langues de communication préférées (liste sérialisée)
      nativeDataType: TEXT
      partOfKey: false
    - fieldPath: multiple_birth_x
      type: record
      description: Indique si le patient fait partie d'une naissance multiple (booléen ou entier) — FHIR multipleBirth[x]
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: multiple_birth_integer
      type: number
      description: Rang gémellaire pour les naissances multiples (1 à 10)
      nativeDataType: INTEGER
      partOfKey: false
    - fieldPath: general_practitioners
      type: record
      description: Médecin(s) traitant(s) désignés par le patient — FHIR generalPractitioner Reference (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: managing_organization
      type: record
      description: Organisation responsable du dossier patient — FHIR managingOrganization Reference (0..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: links
      type: record
      description: Lien vers une autre ressource Patient concernant la même personne réelle — utilisé pour la déduplication d'identité
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: meta
      type: record
      description: Métadonnées de la ressource FHIR (version, lastUpdated, profil, labels de sécurité) — FHIR Meta
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: implicit_rules
      type: string
      description: Ensemble de règles sous lesquelles ce contenu a été créé — FHIR implicitRules (0..1)
      nativeDataType: VARCHAR(255)
      partOfKey: false
    - fieldPath: resource_language
      type: string
      description: Langue du contenu de la ressource — FHIR language (0..1)
      nativeDataType: VARCHAR(10)
      partOfKey: false
    - fieldPath: text_div
      type: string
      description: Résumé textuel de la ressource pour l'interprétation humaine — FHIR Narrative text
      nativeDataType: TEXT
      partOfKey: false
    - fieldPath: contained
      type: record
      description: Ressources intégrées sans identité indépendante — FHIR contained (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: extensions
      type: record
      description: Contenu supplémentaire défini par les implémentations — FHIR extension (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: modifier_extensions
      type: record
      description: Extensions qui ne peuvent pas être ignorées — FHIR modifierExtension (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: created_at
      type: date
      description: Date de création de l'enregistrement (audit)
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
    - fieldPath: updated_at
      type: date
      description: Date de dernière mise à jour de l'enregistrement (audit)
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
properties:
  fhir.resource_type: "Patient"
  fhir.version: "4.0.1"
  source_system: EDSH
subTypes: Table
tags:
  - fhir
  - fhir:Patient
glossaryTerms:
  - fhir:Patient
owners:
  owner: datahub
  type: TECHNICAL_OWNER
domains: "3667192a0a19c51419efe99aa865c1ba"
---
#urn: "urn:li:dataset:(urn:li:dataPlatform:postgres,semantic_layer.public.fhir_encounter,PROD)"
kind: DATASET
name: semantic_layer_public_fhir_encounter
platform: postgres
env: PROD
description: "Ressource FHIR Encounter (profil DMEncounter) — Interaction entre un patient et des prestataires de soins de santé. Couvre les séjours hospitaliers (MCO, SSR, PSY), les consultations et les passages aux urgences, avec codage de la source d'admission et du mode de sortie PMSI."
container:
  platform: postgres
  instance: postgres
  database: semantic_layer
  schema: public
  env: PROD
schema:
  fields:
    - fieldPath: id
      type: string
      description: Identifiant unique de la ressource FHIR Encounter (clé primaire)
      nativeDataType: VARCHAR(64)
      partOfKey: true
    - fieldPath: last_updated
      type: date
      description: Date et heure de dernière mise à jour de la ressource
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
    - fieldPath: status
      type: string
      description: État courant de l'encounter — planned | arrived | triaged | in-progress | onleave | finished | cancelled | entered-in-error | unknown (élément modificateur)
      nativeDataType: VARCHAR(20)
      partOfKey: false
    - fieldPath: status_history
      type: record
      description: Historique des statuts de l'encounter dans le temps — FHIR statusHistory (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: class
      type: record
      description: Classification de la rencontre patient (hospitalisation, ambulatoire, urgences) — FHIR class Coding (1..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: class_display
      type: string
      description: Libellé textuel de la classe d'encounter pour faciliter les requêtes
      nativeDataType: VARCHAR(255)
      partOfKey: false
    - fieldPath: class_history
      type: record
      description: Historique des classes de l'encounter dans le temps — FHIR classHistory (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: types
      type: record
      description: Type spécifique de l'encounter (consultation, chirurgie ambulatoire, etc.) — FHIR type CodeableConcept (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: service_type
      type: record
      description: Catégorie générale du service fourni — FHIR serviceType CodeableConcept (0..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: priority
      type: record
      description: Urgence de l'encounter — FHIR priority CodeableConcept (0..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: identifiers
      type: record
      description: Identifiants métier de cet encounter — FHIR identifier (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: subject
      type: record
      description: Patient présent à l'encounter — FHIR subject Reference(Patient|Group) (0..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: subject_patient_id
      type: string
      description: Référence obligatoire vers fhir_patient — règle métier imposée (NOT NULL, FK)
      nativeDataType: VARCHAR(64)
      partOfKey: false
    - fieldPath: episodes_of_care
      type: record
      description: Épisode(s) de soins auquel cet encounter est rattaché — FHIR episodeOfCare Reference (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: based_on_s
      type: record
      description: Rendez-vous ou demande de service à l'origine de cet encounter — FHIR basedOn Reference (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: participants
      type: record
      description: Liste des personnes impliquées dans l'encounter — FHIR participant BackboneElement (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: appointments
      type: record
      description: Rendez-vous ayant planifié cet encounter — FHIR appointment Reference (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: period_start
      type: date
      description: Date et heure de début de l'encounter — FHIR period.start
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
    - fieldPath: period_end
      type: date
      description: Date et heure de fin de l'encounter — FHIR period.end (>= period_start)
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
    - fieldPath: length
      type: record
      description: Durée de l'encounter (hors congés) — FHIR length Duration
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: length_number_of_day
      type: number
      description: Durée du séjour en nombre de jours pour les rapports (>= 0)
      nativeDataType: INTEGER
      partOfKey: false
    - fieldPath: reason_codes
      type: record
      description: Motif codé de l'encounter — FHIR reasonCode CodeableConcept (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: reason_references
      type: record
      description: Motif de l'encounter (référence vers d'autres ressources) — FHIR reasonReference Reference (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: diagnoses
      type: record
      description: Liste des diagnostics pertinents pour l'encounter — FHIR diagnosis BackboneElement (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: account
      type: record
      description: Compte(s) associé(s) à l'encounter — FHIR account Reference(Account) (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: hospitalization
      type: record
      description: Détails de l'hospitalisation — FHIR hospitalization BackboneElement (0..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: admit_source_text
      type: string
      description: "Mode d'entrée PMSI — Mutation | Transfert définitif | Transfert provisoire | Domicile | Naissance | Patient entré décédé pour prélèvement d'organes"
      nativeDataType: VARCHAR(255)
      partOfKey: false
    - fieldPath: discharge_disposition_text
      type: string
      description: "Mode de sortie PMSI — Mutation | Transfert définitif | Transfert provisoire | Domicile | Décès"
      nativeDataType: VARCHAR(255)
      partOfKey: false
    - fieldPath: locations
      type: record
      description: Liste des lieux où le patient se trouvait pendant l'encounter — FHIR location BackboneElement (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: service_provider
      type: record
      description: Organisation prestataire de services — FHIR serviceProvider Reference(Organization) (0..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: service_provider_organization_display
      type: string
      description: Libellé textuel de l'organisation prestataire pour faciliter les requêtes
      nativeDataType: VARCHAR(64)
      partOfKey: false
    - fieldPath: part_of
      type: record
      description: Encounter parent dont celui-ci fait partie — FHIR partOf Reference(Encounter) (0..1)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: meta
      type: record
      description: Métadonnées de la ressource FHIR — FHIR Meta
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: implicit_rules
      type: string
      description: Ensemble de règles sous lesquelles ce contenu a été créé — FHIR implicitRules (0..1)
      nativeDataType: VARCHAR(255)
      partOfKey: false
    - fieldPath: resource_language
      type: string
      description: Langue du contenu de la ressource — FHIR language (0..1)
      nativeDataType: VARCHAR(10)
      partOfKey: false
    - fieldPath: text_div
      type: string
      description: Résumé textuel de la ressource pour l'interprétation humaine — FHIR Narrative text
      nativeDataType: TEXT
      partOfKey: false
    - fieldPath: contained
      type: record
      description: Ressources intégrées sans identité indépendante — FHIR contained (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: extensions
      type: record
      description: Contenu supplémentaire défini par les implémentations — FHIR extension (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: modifier_extensions
      type: record
      description: Extensions qui ne peuvent pas être ignorées — FHIR modifierExtension (0..*)
      nativeDataType: JSONB
      partOfKey: false
    - fieldPath: created_at
      type: date
      description: Date de création de l'enregistrement (audit)
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
    - fieldPath: updated_at
      type: date
      description: Date de dernière mise à jour de l'enregistrement (audit)
      nativeDataType: TIMESTAMP WITH TIME ZONE
      partOfKey: false
properties:
  fhir.resource_type: "Encounter"
  fhir.version: 4.0.1
  source_system: EDSH
subTypes: Table
tags:
  - fhir
  - fhir:Encounter
glossaryTerms:
  - fhir:Encounter
